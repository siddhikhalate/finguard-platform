services:
  # ============================================================================
  # 1. PostgreSQL 16 Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: finguard-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-finguard_master}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finguard} -d ${POSTGRES_DB:-finguard_master}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finguard-network

  # ============================================================================
  # 2. Redis In-Memory Cache & Sliding Window Engine
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: finguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - finguard-network

  # ============================================================================
  # 3. Apache Kafka (KRaft Mode - No ZooKeeper Required)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: finguard-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - finguard-network

  # ============================================================================
  # 4. Kafka UI (Developer & Interview Visualizer for Topics and Events)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: finguard-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: finguard-kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    networks:
      - finguard-network

  # ============================================================================
  # 5. FinGuard Application Services (Profile: "apps")
  # Run with: docker compose --profile apps up -d
  # ============================================================================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: finguard-auth-service
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finguard_secret}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required}
      INTERNAL_GATEWAY_KEY: ${INTERNAL_GATEWAY_KEY:-finguard-internal-secret-gateway-key-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finguard-network
    profiles: ["apps"]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: finguard-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required}
      INTERNAL_GATEWAY_KEY: ${INTERNAL_GATEWAY_KEY:-finguard-internal-secret-gateway-key-change-in-prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app,https://finguard-platform.vercel.app}
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finguard-network
    profiles: ["apps"]

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: finguard-transaction-service
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/txn_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finguard_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_GATEWAY_KEY: ${INTERNAL_GATEWAY_KEY:-finguard-internal-secret-gateway-key-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finguard-network
    profiles: ["apps"]

  fraud-detection-service:
    build:
      context: .
      dockerfile: fraud-detection-service/Dockerfile
    container_name: finguard-fraud-detection-service
    restart: unless-stopped
    expose:
      - "8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finguard_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_GATEWAY_KEY: ${INTERNAL_GATEWAY_KEY:-finguard-internal-secret-gateway-key-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finguard-network
    profiles: ["apps"]

  incident-service:
    build:
      context: .
      dockerfile: incident-service/Dockerfile
    container_name: finguard-incident-service
    restart: unless-stopped
    expose:
      - "8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/incident_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finguard_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_GATEWAY_KEY: ${INTERNAL_GATEWAY_KEY:-finguard-internal-secret-gateway-key-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finguard-network
    profiles: ["apps"]

  ai-explanation-service:
    build:
      context: .
      dockerfile: ai-explanation-service/Dockerfile
    container_name: finguard-ai-explanation-service
    restart: unless-stopped
    expose:
      - "8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      INTERNAL_GATEWAY_KEY: ${INTERNAL_GATEWAY_KEY:-finguard-internal-secret-gateway-key-change-in-prod}
    depends_on:
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finguard-network
    profiles: ["apps"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - finguard-network
    profiles: ["apps"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  finguard-network:
    driver: bridge
