server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - "Authorization"
              - "X-Correlation-Id"
            allowCredentials: true
            maxAge: 3600

      routes:
        # 1. Auth Service Routes
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/auth/**

        # 2. Transaction Service Routes
        - id: transaction-service
          uri: http://${TRANSACTION_SERVICE_HOST:localhost}:${TRANSACTION_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/transactions/**

        # 3. Fraud Detection Service Routes
        - id: fraud-service
          uri: http://${FRAUD_SERVICE_HOST:localhost}:${FRAUD_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/fraud/**

        # 4. Incident Management Service Routes
        - id: incident-service
          uri: http://${INCIDENT_SERVICE_HOST:localhost}:${INCIDENT_SERVICE_PORT:8084}
          predicates:
            - Path=/api/v1/incidents/**

        # 5. AI Explanation Service Routes
        - id: ai-service
          uri: http://${AI_SERVICE_HOST:localhost}:${AI_SERVICE_PORT:8085}
          predicates:
            - Path=/api/v1/ai/**

finguard:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
